<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1008">
<title>Metin2 Mobile — Efsane Sürüm</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--wood:#2b1d10;--wood2:#3d2a17;--gold:#d4a84a;--gold2:#8a6a24;--parch:#f0dcae;--ink:#e8d9a8;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Trebuchet MS',Verdana,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;color:var(--ink);}
  canvas#game{display:block;position:fixed;inset:0;}
  .win{background:linear-gradient(180deg,var(--wood2),var(--wood));border:2px solid var(--gold);border-radius:8px;box-shadow:0 0 0 1px #000,0 6px 22px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,220,140,.15);}
  /* karakter penceresi */
  #charWin{position:fixed;top:6px;left:6px;z-index:20;width:210px;padding:6px 8px 7px 62px;pointer-events:none;}
  #portrait{position:absolute;left:-1px;top:-1px;width:56px;height:56px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(circle at 35% 30%,#7a8aa8,#26324a 70%);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 0 2px #000,0 3px 8px #000;}
  #lvBadge{position:absolute;left:34px;top:38px;min-width:26px;height:20px;border-radius:10px;background:#1a1008;border:2px solid var(--gold);font-size:11px;font-weight:bold;text-align:center;line-height:16px;color:#ffe08a;padding:0 4px;}
  #pName{font-size:12px;font-weight:bold;color:#ffe9b0;text-shadow:0 1px 2px #000;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar{position:relative;height:13px;border-radius:7px;background:rgba(0,0,0,.7);border:1px solid #000;overflow:hidden;margin-bottom:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
  .bar>i{display:block;height:100%;width:100%;transition:width .15s;}
  .bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000;}
  #hpFill{background:linear-gradient(180deg,#ff6a5a,#a80000);}#mpFill{background:linear-gradient(180deg,#6a9bff,#0030a8);}
  /* hedef */
  #targetBar{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:20;width:150px;padding:4px 8px 6px;pointer-events:none;display:none;text-align:center;margin-left:-6px;}
  #tName{font-size:11px;font-weight:bold;color:#ffd0a0;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #tFill{background:linear-gradient(180deg,#ff8a5a,#a02800);}
  /* minimap */
  #mini{position:fixed;top:6px;right:6px;z-index:20;width:112px;text-align:center;pointer-events:none;}
  #miniCv{width:104px;height:104px;border-radius:50%;border:3px solid var(--gold);background:#222;box-shadow:0 0 0 2px #000,0 3px 10px #000;display:block;margin:0 auto;}
  #zoneName{font-size:11px;font-weight:bold;color:#ffe9b0;text-shadow:0 1px 3px #000;margin-top:3px;}
  #coords{font-size:9px;color:#cdb98a;text-shadow:0 1px 2px #000;}
  #menu{position:fixed;top:140px;right:6px;z-index:20;display:flex;flex-direction:column;gap:5px;}
  #menu button,.sq{width:38px;height:38px;border-radius:8px;border:2px solid var(--gold);background:linear-gradient(180deg,#4a3320,#21160b);color:var(--parch);font-size:17px;font-family:inherit;box-shadow:0 0 0 1px #000,0 2px 5px rgba(0,0,0,.6);position:relative;}
  #menu button:active,.sq:active{transform:scale(.93);} 
  .dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:#d33;color:#fff;font-size:10px;line-height:16px;font-weight:bold;display:none;}
  /* sohbet */
  #chat{position:fixed;left:6px;bottom:22px;width:min(52vw,250px);height:96px;z-index:19;pointer-events:none;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.35));padding:3px 5px;border-radius:6px;}
  #chat div{font-size:10.5px;line-height:1.35;text-shadow:0 1px 2px #000;}
  /* exp */
  #expBar{position:fixed;left:0;right:0;bottom:0;height:14px;z-index:21;background:rgba(0,0,0,.8);border-top:2px solid var(--gold);pointer-events:none;}
  #xpFill{height:100%;width:0;background:linear-gradient(180deg,#ffe58a,#c98a14);transition:width .2s;}
  #xpTxt{position:absolute;inset:0;font-size:9px;text-align:center;line-height:12px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000;}
  /* kontroller */
  #joyZone{position:fixed;left:0;top:0;width:50%;height:100%;z-index:15;}
  #joyBase{position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);transform:translate(-50%,-50%);opacity:0;transition:opacity .12s;box-shadow:0 0 20px rgba(0,0,0,.5) inset;pointer-events:none;}
  #joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#c9a227 60%,#7a5f10);transform:translate(-50%,-50%);box-shadow:0 3px 8px rgba(0,0,0,.6);}
  #btnWrap{position:fixed;right:10px;bottom:24px;z-index:20;width:196px;height:206px;}
  #btnWrap button{position:absolute;font-family:inherit;color:#fff;font-weight:bold;}
  #atkBtn{right:0;bottom:0;width:84px;height:84px;border-radius:50%;border:3px solid var(--gold);font-size:34px;background:radial-gradient(circle at 35% 28%,#ff9d4d,#d63a00 65%,#7a1a00);box-shadow:0 0 0 2px #000,0 4px 0 rgba(0,0,0,.5);}
  #atkBtn:active{transform:translateY(3px);} #atkBtn.cool{filter:grayscale(.55) brightness(.7);}
  .skillBtn{width:52px;height:52px;border-radius:9px;border:2px solid #8fa8ff;font-size:9px;line-height:1.1;background:radial-gradient(circle at 35% 28%,#5a7bff,#1a2fa8 65%,#0a1060);box-shadow:0 0 0 1px #000,0 3px 0 rgba(0,0,0,.5);padding:2px;}
  .skillBtn:active{transform:translateY(2px);} .skillBtn.cool{filter:grayscale(.7) brightness(.55);} .skillBtn.off{filter:grayscale(1) brightness(.35);}
  .skillBtn .cost{display:block;font-size:8px;color:#a0c0ff;}
  #s1{right:92px;bottom:2px;} #s2{right:92px;bottom:58px;} #s3{right:36px;bottom:94px;} #s4{right:92px;bottom:114px;}
  .potBtn{width:42px;height:42px;border-radius:8px;border:2px solid var(--gold);font-size:19px;background:linear-gradient(180deg,#4a3320,#21160b);box-shadow:0 0 0 1px #000;}
  #hpPot{right:150px;bottom:2px;} #mpPot{right:150px;bottom:50px;}
  .potBtn small{position:absolute;right:2px;bottom:0;font-size:10px;text-shadow:0 1px 2px #000;}
  #mountBtn{right:150px;bottom:98px;width:42px;height:42px;border-radius:8px;border:2px solid var(--gold);background:linear-gradient(180deg,#4a3320,#21160b);font-size:19px;display:none;}
  #talkBtn{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:22;display:none;padding:10px 20px;border-radius:10px;border:2px solid var(--gold);background:linear-gradient(180deg,#5c4412,#241a06);color:#ffe9b0;font-weight:bold;font-size:14px;font-family:inherit;box-shadow:0 0 18px rgba(255,200,80,.5);}
  #info{position:fixed;top:66px;left:8px;z-index:20;pointer-events:none;font-size:10.5px;color:#ffe9a8;text-shadow:0 1px 3px #000;line-height:1.5;}
  /* paneller */
  #lowHp{position:fixed;inset:0;pointer-events:none;z-index:19;opacity:0;background:radial-gradient(circle,transparent 35%,rgba(190,0,0,.75) 100%);}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:18;background:radial-gradient(circle,transparent 48%,rgba(0,0,0,.42) 100%);}
  #comboBox{position:fixed;left:50%;top:26%;transform:translateX(-50%) scale(.6);z-index:30;pointer-events:none;font-size:30px;font-weight:bold;color:#ffcf40;text-shadow:0 0 12px #f80,0 3px 0 #000;opacity:0;transition:opacity .15s,transform .15s;}
  #comboBox.show{opacity:1;transform:translateX(-50%) scale(1);}
  #dodgeBtn{right:150px;bottom:146px;width:42px;height:42px;border-radius:8px;border:2px solid #8fd0ff;background:linear-gradient(180deg,#2a4a6a,#10202e);font-size:19px;}
  #dodgeBtn.cool{filter:grayscale(.8) brightness(.5);}
  #kingdomList{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .kingdomCard{padding:6px 10px;border:2px solid #6a5a2a;border-radius:8px;background:#120c02;font-size:12px;font-weight:bold;cursor:pointer;}
  .kingdomCard small{display:block;font-size:9px;color:#9fb3c8;font-weight:normal;} .kingdomCard.sel{border-color:#fff;box-shadow:0 0 14px rgba(255,215,0,.6);}
  .skillBtn.maxed{box-shadow:0 0 0 1px #000,0 0 10px #fc4;}
  .panel{position:fixed;z-index:50;display:none;flex-direction:column;gap:6px;padding:0 10px 10px;max-height:82vh;overflow-y:auto;touch-action:pan-y;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,360px);}
  .panel.open{display:flex;}
  .panel h3{margin:0 -10px 4px;padding:7px 10px;font-size:14px;letter-spacing:1px;color:#ffe9b0;background:linear-gradient(180deg,#6a4a22,#3a2810);border-bottom:2px solid var(--gold);border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2;}
  .panel h3 .x{width:24px;height:24px;border-radius:5px;border:1px solid var(--gold);background:#2a1b0c;color:#ffd;text-align:center;line-height:20px;font-size:14px;}
  .panel button{padding:6px 10px;border:1px solid var(--gold);border-radius:6px;background:linear-gradient(180deg,#5a4020,#2a1b0c);color:#ffe9b0;font-weight:bold;font-size:12px;font-family:inherit;}
  .panel button:active{transform:scale(.96);} .panel button:disabled{opacity:.4;}
  .small{font-size:10.5px;color:#b9c6d6;} .row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .itemRow{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:11px;}
  .itemRow .name{flex:1;line-height:1.25;} .itemRow .aff{display:block;font-size:9.5px;color:#9fd0ff;}
  .itemRow button{padding:3px 7px!important;font-size:10px!important;}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
  .slot{border:1px solid var(--gold2);border-radius:6px;min-height:46px;padding:3px;font-size:9.5px;text-align:center;background:rgba(0,0,0,.35);line-height:1.2;}
  .slot b{display:block;font-size:9px;color:#9a8a68;font-weight:normal;}
  .tabs{display:flex;gap:5px;} .tabs button.on{background:linear-gradient(180deg,#c99a3a,#7a5518);color:#1a1008;}
  .stat{display:flex;align-items:center;justify-content:space-between;padding:3px 6px;background:rgba(0,0,0,.25);border-radius:5px;font-size:11.5px;}
  .rarity-common{color:#ddd;}.rarity-uncommon{color:#6f6;}.rarity-rare{color:#6af;}.rarity-epic{color:#d9f;}.rarity-legendary{color:#fa3;}
  .dmg{position:fixed;pointer-events:none;font-weight:bold;font-size:18px;z-index:30;text-shadow:0 2px 4px #000,0 0 8px rgba(0,0,0,.8);transform:translate(-50%,-50%);animation:dmgUp .8s cubic-bezier(.2,.8,.4,1) forwards;white-space:nowrap;}
  @keyframes dmgUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}18%{opacity:1;transform:translate(-50%,-80%) scale(1.2);}100%{opacity:0;transform:translate(-50%,-180%) scale(1);}}
  .dmg.crit{font-size:25px;color:#ffd24a;}
  .lbl{position:fixed;z-index:18;pointer-events:none;transform:translate(-50%,-100%);font-size:11px;font-weight:bold;color:#ffe9b0;text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap;display:none;}
  .lbl.npc{color:#9fffa0;} .lbl.me{color:#fff;}
  #msg{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:40;font-size:22px;font-weight:bold;color:#ffd966;text-shadow:0 0 16px #000,0 3px 6px #000;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center;letter-spacing:1px;max-width:90vw;}
  #flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,0,0,0) 40%,rgba(255,0,0,.7));opacity:0;pointer-events:none;z-index:25;transition:opacity .15s;}
  #start{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 50% 40%,#2a3f58,#05070b 75%);color:var(--ink);text-align:center;padding:20px;overflow-y:auto;touch-action:pan-y;}
  #start h1{font-size:28px;letter-spacing:3px;color:#ffd966;text-shadow:0 0 20px rgba(255,190,60,.5),0 4px 8px #000;}
  #classList{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:380px;}
  .classCard{padding:9px 12px;border:2px solid var(--gold);border-radius:10px;background:linear-gradient(180deg,#2a1e08,#120c02);cursor:pointer;min-width:98px;}
  .classCard.sel{border-color:#fff;box-shadow:0 0 20px rgba(255,215,0,.6);} .classCard b{display:block;font-size:14px;color:#ffd966;} .classCard span{font-size:10px;color:#9fb3c8;}
  #nameIn{padding:8px 12px;border-radius:8px;border:2px solid var(--gold);background:#120c02;color:#ffe9b0;font-size:14px;text-align:center;font-family:inherit;width:200px;user-select:text;-webkit-user-select:text;touch-action:auto;}
  .bigBtn{padding:13px 40px;font-size:16px;font-weight:bold;letter-spacing:2px;border:2px solid var(--gold);border-radius:10px;background:linear-gradient(180deg,#5c4412,#241a06);color:#ffd966;box-shadow:0 0 22px rgba(201,162,39,.4);font-family:inherit;}
  .bigBtn:active{transform:scale(.96);} .bigBtn:disabled{opacity:.45;} .bigBtn.alt{background:linear-gradient(180deg,#2a2f3a,#12151b);font-size:13px;padding:9px 26px;letter-spacing:1px;box-shadow:none;}
  #loadMsg{font-size:12px;color:#9fb3c8;min-height:16px;max-width:340px;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="charWin" class="win"><div id="portrait">⚔</div><div id="lvBadge">1</div><div id="pName">Kahraman</div>
  <div class="bar"><i id="hpFill"></i><span id="hpTxt">100 / 100</span></div><div class="bar" style="height:11px"><i id="mpFill"></i><span id="mpTxt">50 / 50</span></div></div>
<div id="targetBar" class="win"><div id="tName"></div><div class="bar" style="margin:3px 0 0"><i id="tFill"></i><span id="tTxt"></span></div></div>
<div id="mini"><canvas id="miniCv" width="104" height="104"></canvas><div id="zoneName">Köy</div><div id="coords"></div></div>
<div id="menu"><button id="invBtn">🎒</button><button id="charBtn">📊<span class="dot" id="ptDot">!</span></button><button id="questBtn">📜</button><button id="sndBtn">🔊</button></div>
<div id="info"></div>
<div id="chat"></div>
<div id="expBar"><div id="xpFill"></div><div id="xpTxt"></div></div>
<div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
<div id="btnWrap">
  <button id="s4" class="skillBtn">-</button><button id="s3" class="skillBtn">-</button><button id="s2" class="skillBtn">-</button><button id="s1" class="skillBtn">-</button>
  <button id="hpPot" class="potBtn">🧪<small id="hpN">0</small></button><button id="mpPot" class="potBtn">💧<small id="mpN">0</small></button><button id="mountBtn">🐎</button><button id="dodgeBtn">💨</button>
  <button id="atkBtn">⚔</button>
</div>
<button id="talkBtn">💬 Konuş</button>
<div id="invPanel" class="panel win"><h3><span>ENVANTER</span><span class="x" data-close>✕</span></h3><div id="invBody"></div></div>
<div id="charPanel" class="panel win"><h3><span>KARAKTER</span><span class="x" data-close>✕</span></h3><div id="charBody"></div></div>
<div id="questPanel" class="panel win"><h3><span>GÖREVLER</span><span class="x" data-close>✕</span></h3><div id="questBody"></div></div>
<div id="npcPanel" class="panel win"><h3><span id="npcTitle">NPC</span><span class="x" data-close>✕</span></h3><div id="npcBody"></div></div>
<div id="vig"></div><div id="lowHp"></div><div id="comboBox"></div><div id="flash"></div>
<div id="msg"></div>
<div id="start">
  <h1>METİN AVCILARI</h1>
  <p style="font-size:12px;color:#9fb3c8;max-width:350px;line-height:1.6">Köyden çık, 4 bölgeyi keşfet, Metin taşlarını kır, zindana gir, eşyalarını geliştir.<br>Sol yarı: hareket · Sağ yarı: kamera · İlerleme otomatik kaydedilir.</p>
  <div id="loadMsg">3B motor yükleniyor…</div>
  <button id="contBtn" class="bigBtn" style="display:none"></button>
  <input id="nameIn" maxlength="14" placeholder="Karakter adı" value="Kahraman">
  <div id="kingdomTitle" style="font-size:12px;color:#9fb3c8">Krallığını seç</div><div id="kingdomList"></div>
  <div id="classList"></div>
  <button id="startBtn" class="bigBtn" disabled>OYUNA BAŞLA</button>
</div>

<script type="module">
/* =========================================================
   0. 3B MOTORU YÜKLE (ilk açılışta internetten; sonra cihazda saklı)
   ========================================================= */
const THREE_URLS=['https://unpkg.com/three@0.160.0/build/three.module.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js'];
const LIB_CACHE='metin-lib-v1';
async function importText(t){return import(URL.createObjectURL(new Blob([t],{type:'text/javascript'})));}
async function loadThree(){
  const errs=[];
  /* 1) Doğrudan adres (orijinal yöntem; önizleme/sandbox pencerelerinde de çalışır) */
  for (const u of THREE_URLS){
    try{ const m=await import(u);
      try{ if(window.caches) fetch(u).then(r=>r.ok?r.text():null).then(t=>{ if(t) return caches.open(LIB_CACHE).then(c=>c.put(u,new Response(t,{headers:{'content-type':'text/javascript'}}))); }).catch(()=>{}); }catch(e){}
      return m; }catch(e){ errs.push(e); }
  }
  /* 2) Cihazda saklı kopya (internet yoksa) */
  try{ const c=await caches.open(LIB_CACHE); for (const u of THREE_URLS){ const r=await c.match(u); if(r) return await importText(await r.text()); } }catch(e){ errs.push(e); }
  /* 3) Metni indirip blob olarak yükle */
  for (const u of THREE_URLS){ try{ const r=await fetch(u); if(!r.ok)throw new Error('HTTP '+r.status); return await importText(await r.text()); }catch(e){ errs.push(e); } }
  throw errs[errs.length-1]||new Error('yüklenemedi');
}
const $ = id => document.getElementById(id);
let THREE;
try{ THREE = window.__THREE_STUB || await loadThree(); }
catch(err){
  $('loadMsg').textContent='⚠️ 3B motor yüklenemedi. İlk açılışta internet gerekir; bağlantını kontrol edip sayfayı yenile. ('+(err&&err.message||err)+')';
  throw err;
}
$('loadMsg').textContent='';


/* =========================================================
   1. SAHNE, SES, YARDIMCILAR
   ========================================================= */
const canvas=$('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9fd0ec); scene.fog=new THREE.Fog(0x9fd0ec,45,115);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.5,240);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
scene.add(new THREE.HemisphereLight(0xdcecff,0x5a7a3a,1.05));
const sun=new THREE.DirectionalLight(0xfff0cc,1.2); sun.position.set(30,50,20); scene.add(sun);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tmpV=new THREE.Vector3();
let actx=null,muted=false; try{muted=localStorage.getItem('metin2m_muted')==='1';}catch(e){}
function audioInit(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
const SFX={hit:[220,.07,'square',-120,.05],crit:[440,.12,'sawtooth',-200,.07],hurt:[110,.18,'sawtooth',-60,.09],skill:[330,.22,'triangle',300,.08],
  drop:[660,.14,'sine',400,.07],level:[523,.5,'triangle',523,.1],die:[200,.3,'square',-150,.08],quest:[587,.35,'triangle',293,.08],miss:[150,.05,'sine',0,.03],buy:[880,.1,'sine',200,.06],pot:[400,.2,'sine',300,.06],fail:[180,.3,'sawtooth',-100,.08]};
function sfx(n){if(muted||!actx)return;const s=SFX[n];if(!s)return;try{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;

function gfxUpdate(dt){
  FX.t+=dt;const t=FX.t,cp=camera.position,pp=player.group.position;
  skyDome.position.copy(cp);
  if(scene.fog&&scene.fog.color&&skyMat.uniforms.hor.value.copy)skyMat.uniforms.hor.value.copy(scene.fog.color);

  /* yavaş gün döngüsü: öğle ↔ altın saat */
  const el=(48+22*Math.sin(t*2*Math.PI/420))*Math.PI/180,az=.7;
  skyMat.uniforms.sunD.value.set(Math.cos(el)*Math.sin(az),Math.sin(el),Math.cos(el)*Math.cos(az));
  if(typeof sun!=='undefined'&&sun.position){sun.position.set(skyMat.uniforms.sunD.value.x*60,skyMat.uniforms.sunD.value.y*60,skyMat.uniforms.sunD.value.z*60);
    const warm=1-Math.min(1,(el*180/Math.PI-26)/22);if(sun.color&&sun.color.setRGB)sun.color.setRGB(1,1-.18*warm,1-.38*warm);}
  const cc=tmpC2.setHex(CLOUDC[FX.zone]||0xffffff);
  for(const c of clouds){c.a+=dt*c.sp;c.s.position.set(cp.x+Math.cos(c.a)*c.r,c.h,cp.z+Math.sin(c.a)*c.r);if(c.s.material.color.lerp)c.s.material.color.lerp(cc,Math.min(1,dt));}
  /* hava durumu */
  if(wcur&&wpts.visible){const n=wcur.n,W=30,H=22;for(let i=0;i<n;i++){let x=wpos[i*3]+wcur.vx*dt,y=wpos[i*3+1]+wcur.vy*dt+(wcur.wrap?Math.sin(t+i)*.3*dt:0),z=wpos[i*3+2];
      if(wcur.vy===-22)z+=0;if(x-pp.x>W)x-=2*W;else if(x-pp.x<-W)x+=2*W;if(z-pp.z>W)z-=2*W;else if(z-pp.z<-W)z+=2*W;if(y<0)y+=H;else if(y>H)y-=H;
      wpos[i*3]=x;wpos[i*3+1]=y;wpos[i*3+2]=z;}wgeo.attributes.position.needsUpdate=true;}
  /* parıltılar */
  for(let i=glows.length-1;i>=0;i--){const g=glows[i];if(g.owner&&g.owner.dead){if(g.parent&&g.parent.remove)g.parent.remove(g.s);g.s.material.dispose();glows.splice(i,1);continue;}
    const k=g.base*(1+.13*Math.sin(t*3+g.ph));g.s.scale.set(k,k,1);}

  for(const s of slashes)if(s.life>0){s.life-=dt;const k=Math.max(0,s.life/s.max);s.m.material.opacity=k*.9;s.g.rotation.y+=dt*3;if(s.life<=0)s.g.visible=false;}
  for(const p of ponds)p.w.material.opacity=.78+Math.sin(t*1.4+p.ph)*.06;

}

  slowT-=dt;if(slowT<=0){slowT=.22;
    if(!target||target.dead||target.mesh.position.distanceTo(pos)>16){target=null;let bd=10;for(const e of enemies){if(e.dead)continue;const d=e.mesh.position.distanceTo(pos);if(d<bd){bd=d;target=e;}}}
    const tb=$('targetBar');if(target){tb.style.display='block';$('tName').textContent=target.name+' Lv'+target.lv;$('tFill').style.width=PCT(target.hp,target.maxHp);$('tTxt').textContent=Math.max(0,Math.ceil(target.hp))+' / '+target.maxHp;}else tb.style.display='none';
    const ents=[];for(const e of enemies){if(e.dead)continue;ents.push({x:e.mesh.position.x,z:e.mesh.position.z,c:e.isPvP?'#ff3'+'3':e.isMetin?'#4af':e.boss?'#c4f':'#e33',r:e.isMetin||e.boss?3.4:2});}
    if(!dungeon)for(const n of NPCS)ents.push({x:n.x,z:n.z,c:'#ffe58a',r:2.6});
    drawMini(pos.x,pos.z,!!dungeon,ents);$('coords').textContent=Math.round(pos.x)+', '+Math.round(pos.z);
    let t='💰 '+player.yang+(player.keys?'  🗝'+player.keys:'')+(player.shards?'  💎'+player.shards:'');
    if(dungeon)t+='<br>⏱ '+(dungeon.done?'Çıkış: '+Math.ceil(dungeon.exitT)+' sn':Math.max(0,Math.ceil(dungeon.t))+' sn')+' • Dalga '+Math.min(dungeon.def.waves,dungeon.wave)+'/'+dungeon.def.waves;
    else{const m=nearestMetin();t+='<br>'+(m?'🔷 En yakın Metin: '+Math.round(m.d)+' m':'🔷 Metin taşı aranıyor…');}
    if(duel&&!duel.dead)t+='<br>⚔ Düello: rakip '+Math.max(0,Math.ceil(duel.hp))+' / '+duel.maxHp;
    infoEl.innerHTML=t;}
  hudT-=dt;if(hudT<=0){hudT=.25;updateHUD();}
}
function loop(now){
  requestAnimationFrame(loop);const dt=Math.min((now-lastTime)/1000,.05);lastTime=now;
  if(running)update(dt);
  else{cameraYaw+=dt*.12;camera.position.set(Math.sin(cameraYaw)*26,9,Math.cos(cameraYaw)*26);camera.lookAt(0,3,0);}
  gfxUpdate(dt);renderer.render(scene,camera);
}

   13. BAŞLANGIÇ
   ========================================================= */
let selectedClass='savasci',selectedKingdom='aslan',pendingSave=readSave(),newConfirm=false;
const classList=$('classList'),startBtn=$('startBtn'),contBtn=$('contBtn'),nameIn=$('nameIn');
for(const key in CLASSES){const c=CLASSES[key],d=document.createElement('div');d.className='classCard'+(key===selectedClass?' sel':'');d.innerHTML='<b>'+c.icon+' '+c.name+'</b><span>'+c.desc+'</span>';
  d.onclick=()=>{selectedClass=key;[...classList.children].forEach(x=>x.classList.remove('sel'));d.classList.add('sel');newConfirm=false;startBtn.textContent='OYUNA BAŞLA';};classList.appendChild(d);}
const kList=$('kingdomList');KINGDOMS.forEach(k=>{const d=document.createElement('div');d.className='kingdomCard'+(k.id===selectedKingdom?' sel':'');d.style.color=k.c;d.innerHTML=k.n+'<small>'+k.d+'</small>';
  d.onclick=()=>{selectedKingdom=k.id;[...kList.children].forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};kList.appendChild(d);});
if(pendingSave){contBtn.style.display='block';contBtn.textContent='▶ DEVAM: '+pendingSave.name+' — '+CLASSES[pendingSave.cls].name+' Lv '+pendingSave.level;}
startBtn.disabled=false;
scene.add(player.group);
function beginGame(cls,save,name){
  audioInit();player.cls=cls;
  if(save)applySave(save);
  else{Object.assign(player,{name:name||'Kahraman',level:1,xp:0,xpNext:50,yang:100,attr:{st:5,dx:5,ht:5,iq:5},pts:0,sp:2,skills:[1,0,0,0],inventory:[],equipped:{},pots:{hp:5,mp:3},scrolls:{bless:0},keys:0,shards:0,horse:false,arena:0,
      stats:{kills:0,metins:0,pvpWin:0,pvpLoss:0,bosses:0,dungeons:0},mats:{tooth:0,sting:0,shard:0,soul:0,book:1},horseLv:1,horseXp:0,pets:[],petId:0,kingdom:selectedKingdom});
    player.equipped.weapon={id:++itemId,slot:'weapon',name:'Çırak Silahı',rarity:'common',lv:1,stat:6,up:0,value:20,aff:[]};
    player.quests=Object.keys(QDEF).map(k=>makeQuest(k,1,0));}
  player.mounted=false;player.alive=true;player.buffs={};player.skillCd=[0,0,0,0];player.hp=player.mp=1e9;recalcStats();player.hp=player.maxHp;player.mp=player.maxMp;
  player.combo=0;player.comboTimer=0;player.dodging=0;player.dodgeCd=0;clearProjs();rebuildPlayer();buildPetMesh();{const kd=KINGDOMS.find(k=>k.id===player.kingdom);if(kd&&playerLbl)playerLbl.style.color=kd.c;}player.group.position.set(0,0,6);player.group.rotation.y=Math.PI;player.invuln=2;cameraYaw=0;camera.position.set(0,6.6,15.5);
  closePanels();renderSkillButtons();updateHUD();$('start').style.display='none';running=true;setZone('village');
  chat('Hoş geldin, '+player.name+'! Köyde NPC\'lere konuş, ormana git ve Metin taşlarını kır.','#ffe08a');saveGame();
}
contBtn.onclick=()=>{if(pendingSave)beginGame(pendingSave.cls,pendingSave);};
startBtn.onclick=()=>{
  if(pendingSave&&!newConfirm){newConfirm=true;startBtn.textContent='Kayıt silinecek! Emin misin? Tekrar dokun';return;}
  const nm=(nameIn.value||'').trim().slice(0,14)||'Kahraman';try{localStorage.removeItem(SAVE_KEY);}catch(e){}pendingSave=null;beginGame(selectedClass,null,nm);};
setZone('village');
requestAnimationFrame(loop);
if(location.search.indexOf('debug')>=0)window.__game={player,enemies,camps,NPCS,get duel(){return duel;},get dungeon(){return dungeon;},get target(){return target;},CLASSES,Enemy,makeItem,giveItem,equipItem,unequip,sellItem,upgradeItem,rerollAff,dropItem,
  useSkill,doAttack,FX,glows,skyDome,wpts,rings,slashes,ponds,triggerDodge,hatchPet,setActivePet,projs,DGS,MATS,elemProc,addHorseXp,KINGDOMS,PETS,get petMesh(){return petMesh;},gainXP,usePot,toggleMount,startPvP,enterDungeon,leaveDungeon,questProgress,saveGame,readSave,recalcStats,openPanel,openNpc,closePanels,damagePlayer,zoneAt,UP_RATE,SHOP,buy,renderPanel,INV_MAX,upCost,beginGame,setZone,get zone(){return zoneNow;},arenaRank};
